<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Chat | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #1f2937;
        }
        .navbar {
            height: 70px;
            background: #005f5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .navbar h1 { font-size: 21px; }
        .back-btn, .logout-btn {
            border: 1px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 8px;
        }
        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h2 { font-size: 28px; }
        .header p { color: #6b7280; }

        .chat-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            height: 550px;
        }
        .client-list {
            background: white;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            overflow-y: auto;
            padding: 10px;
        }
        .client-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid #f3f4f6;
            position: relative;
        }
        .client-item:hover {
            background: #f3f4f6;
        }
        .client-item.active {
            background: #e5f0ff;
            border-left: 3px solid #005f5f;
        }
        .client-item .name {
            font-weight: 600;
            font-size: 14px;
        }
        .client-item .email {
            font-size: 12px;
            color: #6b7280;
        }
        .client-item .meta {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 3px;
        }
        .client-item .unread-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .chat-container {
            background: white;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
        }
        .chat-header .name {
            font-weight: 700;
            font-size: 16px;
        }
        .chat-header .email {
            font-size: 12px;
            color: #6b7280;
            margin-left: 10px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafbfc;
        }
        .chat-messages .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .msg {
            margin-bottom: 12px;
            max-width: 80%;
        }
        .msg.client {
            margin-right: auto;
        }
        .msg.admin {
            margin-left: auto;
        }
        .msg .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .msg.client .bubble {
            background: #f3f4f6;
            border-bottom-left-radius: 4px;
        }
        .msg.admin .bubble {
            background: #005f5f;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg .time {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
        }
        .msg .sender {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .chat-input {
            padding: 12px 15px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            background: white;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .chat-input input:focus {
            border-color: #005f5f;
        }
        .chat-input button {
            padding: 10px 20px;
            background: #005f5f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-input button:hover { opacity: 0.9; }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 10px; }

        @media (max-width: 768px) {
            .chat-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .client-list {
                max-height: 200px;
            }
            .chat-container {
                height: 400px;
            }
            .navbar { padding: 0 15px; }
            .navbar h1 { font-size: 17px; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>My Resume Portfolio — Admin</h1>
    <div>
        <button id="backBtn" class="back-btn">Dashboard</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</nav>

<main class="container">
    <div class="header">
        <div>
            <h2>💬 Client Chat</h2>
            <p>Chat with your clients in real-time</p>
        </div>
        <div style="color:#10b981;font-weight:600;">
            🟢 Online
        </div>
    </div>

    <div class="chat-layout">
        <!-- Client List -->
        <div class="client-list" id="clientList">
            <div style="text-align:center;padding:20px;color:#6b7280;">Loading clients...</div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-header" id="chatHeader">
                <span style="color:#6b7280;">Select a client to chat</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <p>Select a client to start chatting</p>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="replyInput" placeholder="Type your reply..." onkeypress="if(event.key==='Enter') sendReply()">
                <button id="sendBtn" onclick="sendReply()">📤 Reply</button>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://baepfcdvgruhvaccruum.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cDIynPGbHrsZjUK8gRhpDA_pu20FNiF';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let token = null;
let currentClientId = null;
let lastMessageCount = 0;

async function getToken() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        window.location.href = '/admin.html';
        return null;
    }
    token = session.access_token;
    return token;
}

// ============================================================
// ✅ LOAD CLIENTS
// ============================================================

async function loadClients() {
    const t = await getToken();
    if (!t) return;

    try {
        const response = await fetch('/api/admin/chat/clients', {
            headers: { 'Authorization': `Bearer ${t}` }
        });
        const result = await response.json();

        if (!response.ok) throw new Error(result.message);

        const clients = result.data || [];
        renderClients(clients);

    } catch (error) {
        document.getElementById('clientList').innerHTML = `
            <div style="text-align:center;padding:20px;color:#dc2626;">
                ❌ ${error.message}
            </div>
        `;
    }
}

function renderClients(clients) {
    const container = document.getElementById('clientList');

    if (clients.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:20px;color:#6b7280;">
                💬 No clients have chatted yet
            </div>
        `;
        return;
    }

    // Sort by last message (newest first)
    const sorted = clients.sort((a, b) => new Date(b.last_message) - new Date(a.last_message));

    container.innerHTML = sorted.map(c => `
        <div class="client-item ${currentClientId === c.client_id ? 'active' : ''}" 
             onclick="selectClient('${c.client_id}')">
            <div class="name">${c.client_name}</div>
            <div class="email">${c.client_email}</div>
            <div class="meta">${new Date(c.last_message).toLocaleString()}</div>
            ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
        </div>
    `).join('');
}

// ============================================================
// ✅ SELECT CLIENT
// ============================================================

async function selectClient(clientId) {
    currentClientId = clientId;
    
    // Update active state
    document.querySelectorAll('.client-item').forEach(el => el.classList.remove('active'));
    const items = document.querySelectorAll('.client-item');
    items.forEach(el => {
        if (el.textContent.includes(clientId) || el.onclick?.toString().includes(clientId)) {
            el.classList.add('active');
        }
    });
    
    // Load messages
    await loadClientMessages(clientId);
    
    // Mark as read
    await markAsRead(clientId);
    
    // Refresh client list
    loadClients();
}

// ============================================================
// ✅ LOAD CLIENT MESSAGES
// ============================================================

async function loadClientMessages(clientId) {
    const t = await getToken();
    if (!t) return;

    try {
        const response = await fetch(`/api/admin/chat/messages?client_id=${clientId}`, {
            headers: { 'Authorization': `Bearer ${t}` }
        });
        const result = await response.json();

        if (!response.ok) throw new Error(result.message);

        const messages = result.data || [];
        renderMessages(messages);

        // Get client info
        if (messages.length > 0) {
            document.getElementById('chatHeader').innerHTML = `
                <span class="name">${messages[0].client_name}</span>
                <span class="email">${messages[0].client_email}</span>
                <span style="font-size:12px;color:#6b7280;margin-left:10px;">
                    ${messages.length} messages
                </span>
            `;
        }

    } catch (error) {
        document.getElementById('chatMessages').innerHTML = `
            <div style="text-align:center;padding:40px;color:#dc2626;">
                ❌ ${error.message}
            </div>
        `;
    }
}

function renderMessages(messages) {
    const container = document.getElementById('chatMessages');

    if (messages.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">💬</div>
                <p>No messages yet</p>
            </div>
        `;
        return;
    }

    const sorted = [...messages].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    container.innerHTML = sorted.map(msg => {
        const isAdmin = msg.is_admin === true;
        const msgClass = isAdmin ? 'admin' : 'client';
        const sender = isAdmin ? 'You (Admin)' : (msg.client_name || 'Client');
        const time = new Date(msg.created_at).toLocaleString();

        return `
            <div class="msg ${msgClass}">
                <div class="sender">${sender}</div>
                <div class="bubble">${msg.message}</div>
                <div class="time">${time}</div>
            </div>
        `;
    }).join('');

    container.scrollTop = container.scrollHeight;
}

// ============================================================
// ✅ MARK AS READ
// ============================================================

async function markAsRead(clientId) {
    const t = await getToken();
    if (!t) return;

    try {
        await fetch(`/api/admin/chat/mark-read/${clientId}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${t}` }
        });
    } catch (e) {
        console.error('Mark read error:', e);
    }
}

// ============================================================
// ✅ SEND REPLY
// ============================================================

async function sendReply() {
    if (!currentClientId) {
        alert('Please select a client first');
        return;
    }

    const input = document.getElementById('replyInput');
    const btn = document.getElementById('sendBtn');
    const message = input.value.trim();

    if (!message) {
        alert('Please type a reply');
        return;
    }

    btn.disabled = true;
    btn.textContent = '⏳';

    try {
        const response = await fetch('/api/admin/chat/reply', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                client_id: currentClientId,
                message: message
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || 'Could not send reply');
        }

        input.value = '';
        await loadClientMessages(currentClientId);
        loadClients();

    } catch (error) {
        alert('❌ ' + error.message);
    }

    btn.disabled = false;
    btn.textContent = '📤 Reply';
}

// ============================================================
// ✅ AUTO-REFRESH
// ============================================================

setInterval(() => {
    if (currentClientId) {
        loadClientMessages(currentClientId);
    }
    loadClients();
}, 5000);

// ============================================================
// ✅ LOGOUT & BACK
// ============================================================

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/admin.html';
});

document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/admin-dashboard.html';
});

// ============================================================
// ✅ INIT
// ============================================================

getToken().then(() => {
    loadClients();
});
</script>
</body>
</html>
