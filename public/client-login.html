<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | My Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7f9;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .login-card h1 {
            color: #005f5f;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #005f5f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .login-btn:hover { opacity: 0.9; }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            display: block;
            background: #e7f7ef;
            color: #147a43;
            border: 1px solid #a7e0b8;
        }
        .message.error {
            display: block;
            background: #fdecec;
            color: #b42318;
            border: 1px solid #f5c6c6;
        }
        .message.info {
            display: block;
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }
        .signup-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
        }
        .signup-link:hover { color: #005f5f; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #6b7280;
            text-decoration: none;
        }
        .back-link:hover { color: #005f5f; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h1>🔐 Client Login</h1>
        <p class="subtitle">Access your projects and files</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email" placeholder="client@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
            <div id="message" class="message"></div>
            <div id="statusBadge"></div>
        </form>
        
        <a href="/client-signup.html" class="signup-link">Don't have an account? Sign Up →</a>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('message');
    const statusBadge = document.getElementById('statusBadge');
    
    btn.disabled = true;
    btn.textContent = '⏳ Logging in...';
    msg.className = 'message';
    msg.style.display = 'none';
    statusBadge.innerHTML = '';
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch('/api/client/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        if (!response.ok) {
            // Check if pending or rejected
            if (result.code === 'PENDING') {
                msg.innerHTML = `
                    ⏳ ${result.message}<br>
                    <small>You will receive an email when approved.</small>
                `;
                msg.className = 'message info';
                msg.style.display = 'block';
                statusBadge.innerHTML = `<span class="status-badge status-pending">⏳ Pending Approval</span>`;
                btn.disabled = false;
                btn.textContent = 'Login';
                return;
            }
            if (result.code === 'REJECTED') {
                msg.innerHTML = `
                    ❌ ${result.message}<br>
                    <small>Please contact admin for more information.</small>
                `;
                msg.className = 'message error';
                msg.style.display = 'block';
                statusBadge.innerHTML = `<span class="status-badge status-rejected">❌ Rejected</span>`;
                btn.disabled = false;
                btn.textContent = 'Login';
                return;
            }
            throw new Error(result.message || 'Login failed');
        }
        
        // Success - Store token and redirect
        localStorage.setItem('clientToken', result.data.token);
        localStorage.setItem('clientData', JSON.stringify(result.data.client));
        
        msg.innerHTML = '✅ Login successful! Redirecting...';
        msg.className = 'message success';
        msg.style.display = 'block';
        statusBadge.innerHTML = `<span class="status-badge status-approved">✅ Approved</span>`;
        
        setTimeout(() => {
            window.location.href = '/client-dashboard.html';
        }, 1000);
        
    } catch (err) {
        msg.textContent = '❌ ' + err.message;
        msg.className = 'message error';
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});
</script>
</body>
</html>
