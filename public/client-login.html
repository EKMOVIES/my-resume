<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | My Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7f9;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .login-card h1 {
            color: #005f5f;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #005f5f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .login-btn:hover { opacity: 0.9; }
        .error {
            color: #dc2626;
            margin-top: 12px;
            display: none;
            text-align: center;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6b7280;
            text-decoration: none;
        }
        .back-link:hover { color: #005f5f; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h1>🔐 Client Login</h1>
        <p class="subtitle">Access your projects and files</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="errorMessage" class="error"></div>
        </form>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const error = document.getElementById('errorMessage');
    
    error.style.display = 'none';
    
    try {
        const response = await fetch('/api/client/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        if (!response.ok) {
            throw new Error(result.message || 'Login failed');
        }
        
        // Store token
        localStorage.setItem('clientToken', result.data.token);
        localStorage.setItem('clientData', JSON.stringify(result.data.client));
        
        window.location.href = '/client-dashboard.html';
        
    } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
    }
});
</script>
</body>
</html>
