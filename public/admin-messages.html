<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Messages | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #1f2937;
        }
        .navbar {
            height: 70px;
            background: #005f5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .navbar h1 { font-size: 21px; }
        .back-btn, .logout-btn {
            border: 1px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 8px;
        }
        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .header { margin-bottom: 25px; }
        .header h2 { font-size: 28px; margin-bottom: 7px; }
        .header p { color: #6b7280; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #005f5f;
        }
        .stat-card .label {
            font-size: 13px;
            color: #6b7280;
        }
        .items-list {
            display: grid;
            gap: 15px;
        }
        .item-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }
        .item-card.unread {
            border-left: 4px solid #005f5f;
            background: #f8fbfa;
        }
        .item-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .item-card .header h3 { font-size: 16px; }
        .item-card .header .date {
            font-size: 12px;
            color: #6b7280;
        }
        .item-card .meta {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        .item-card .message-text {
            font-size: 15px;
            line-height: 1.6;
            margin: 10px 0;
        }
        .item-card .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .read-btn {
            background: #005f5f;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .read-btn:hover { opacity: 0.9; }
        .read-btn.read {
            background: #6b7280;
            cursor: default;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .delete-btn:hover { opacity: 0.9; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.unread {
            background: #005f5f;
            color: white;
        }
        .badge.read {
            background: #e5e7eb;
            color: #6b7280;
        }
        .loading { color: #6b7280; margin-bottom: 15px; }
        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        @media (max-width: 700px) {
            .navbar { padding: 0 15px; }
            .navbar h1 { font-size: 17px; }
            .item-card .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>My Resume Portfolio — Admin</h1>
    <div>
        <button id="backBtn" class="back-btn">Dashboard</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</nav>
<main class="container">
    <div class="header">
        <h2>Manage Messages</h2>
        <p>View and manage messages from your portfolio contact form.</p>
    </div>

    <div class="stats" id="statsContainer">
        <div class="stat-card">
            <div class="number" id="totalMessages">0</div>
            <div class="label">Total Messages</div>
        </div>
        <div class="stat-card">
            <div class="number" id="unreadMessages">0</div>
            <div class="label">Unread</div>
        </div>
        <div class="stat-card">
            <div class="number" id="readMessages">0</div>
            <div class="label">Read</div>
        </div>
    </div>

    <div id="loading" class="loading">Loading messages...</div>
    <div id="messagesList" class="items-list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/admin-messages.js"></script>
</body>
</html>
