<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #dc2626; margin-bottom: 10px; }
        p { color: #6b7280; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #005f5f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">❌</div>
        <h1>Payment Failed</h1>
        <p>Your payment was not successful. Please try again.</p>
        <a href="/#services-sale" class="btn">🔄 Try Again</a>
        <br><br>
        <a href="/#services-sale" style="color:#6b7280;text-decoration:none;">← Browse More Services</a>
    </div>
</body>
</html>
