<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #1f2937;
        }
        .navbar {
            height: 70px;
            background: #005f5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .navbar h1 { font-size: 21px; }
        .back-btn, .logout-btn {
            border: 1px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 8px;
        }
        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h2 { font-size: 28px; }
        .header p { color: #6b7280; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #005f5f;
        }
        .stat-card .label {
            font-size: 13px;
            color: #6b7280;
        }

        .items-list {
            display: grid;
            gap: 15px;
        }
        .item-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }
        .item-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .item-card .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .item-card .order-header h3 {
            font-size: 16px;
            color: #005f5f;
        }
        .item-card .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        .item-card .order-details .label {
            color: #6b7280;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.pending { background: #fef3c7; color: #92400e; }
        .badge.processing { background: #dbeafe; color: #1e40af; }
        .badge.completed { background: #dcfce7; color: #166534; }
        .badge.cancelled { background: #fee2e2; color: #991b1b; }
        
        .order-actions {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .order-actions select {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }
        .order-actions button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-update {
            background: #005f5f;
            color: white;
        }
        .btn-update:hover { opacity: 0.9; }
        .btn-delete {
            background: #dc2626;
            color: white;
        }
        .btn-delete:hover { opacity: 0.9; }
        
        .loading { color: #6b7280; padding: 20px; text-align: center; }
        .empty { color: #6b7280; padding: 40px; text-align: center; }
        
        @media (max-width: 700px) {
            .item-card .order-details {
                grid-template-columns: 1fr;
            }
            .navbar { padding: 0 15px; }
            .navbar h1 { font-size: 17px; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>My Resume Portfolio — Admin</h1>
    <div>
        <button id="backBtn" class="back-btn">Dashboard</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</nav>

<main class="container">
    <div class="header">
        <div>
            <h2>📋 Orders</h2>
            <p>Manage customer orders</p>
        </div>
        <div>
            <button onclick="window.location.reload()" class="back-btn" style="color:#333;border-color:#d1d5db;">
                🔄 Refresh
            </button>
        </div>
    </div>

    <div class="stats" id="statsContainer">
        <div class="stat-card">
            <div class="number" id="totalOrders">0</div>
            <div class="label">Total Orders</div>
        </div>
        <div class="stat-card">
            <div class="number" id="pendingOrders">0</div>
            <div class="label">⏳ Pending</div>
        </div>
        <div class="stat-card">
            <div class="number" id="processingOrders">0</div>
            <div class="label">🔄 Processing</div>
        </div>
        <div class="stat-card">
            <div class="number" id="completedOrders">0</div>
            <div class="label">✅ Completed</div>
        </div>
    </div>

    <div id="loading" class="loading">Loading orders...</div>
    <div id="ordersList" class="items-list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://baepfcdvgruhvaccruum.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cDIynPGbHrsZjUK8gRhpDA_pu20FNiF';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let token = null;

async function getToken() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        window.location.href = '/admin.html';
        return null;
    }
    token = session.access_token;
    return token;
}

async function loadOrders() {
    const t = await getToken();
    if (!t) return;

    try {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('ordersList').innerHTML = '';

        const response = await fetch('/api/admin/orders', {
            headers: { 'Authorization': `Bearer ${t}` }
        });
        const result = await response.json();

        if (!response.ok) throw new Error(result.message);

        const data = result.data || [];
        updateStats(data);
        renderOrders(data);
        document.getElementById('loading').style.display = 'none';
    } catch (error) {
        console.error(error);
        document.getElementById('loading').textContent = '❌ ' + error.message;
        document.getElementById('loading').style.display = 'block';
    }
}

function updateStats(data) {
    const total = data.length;
    const pending = data.filter(o => o.payment_status === 'pending').length;
    const processing = data.filter(o => o.order_status === 'processing').length;
    const completed = data.filter(o => o.order_status === 'completed' || o.payment_status === 'completed').length;

    document.getElementById('totalOrders').textContent = total;
    document.getElementById('pendingOrders').textContent = pending;
    document.getElementById('processingOrders').textContent = processing;
    document.getElementById('completedOrders').textContent = completed;
}

function renderOrders(data) {
    const container = document.getElementById('ordersList');

    if (data.length === 0) {
        container.innerHTML = `<div class="empty">📭 No orders yet.</div>`;
        return;
    }

    container.innerHTML = data.map(order => `
        <div class="item-card">
            <div class="order-header">
                <h3>#${order.id.substring(0, 8)}</h3>
                <div>
                    <span class="badge ${order.payment_status}">${order.payment_status}</span>
                    <span class="badge ${order.order_status}">${order.order_status}</span>
                </div>
            </div>
            <div class="order-details">
                <div>
                    <span class="label">Customer:</span> ${order.customer_name}
                </div>
                <div>
                    <span class="label">Email:</span> <a href="mailto:${order.customer_email}">${order.customer_email}</a>
                </div>
                <div>
                    <span class="label">Phone:</span> ${order.customer_phone || 'N/A'}
                </div>
                <div>
                    <span class="label">Amount:</span> <strong>$${parseFloat(order.amount).toFixed(2)}</strong>
                </div>
                <div>
                    <span class="label">Service:</span> ${order.services_sale?.name || 'N/A'}
                </div>
                <div>
                    <span class="label">Date:</span> ${new Date(order.created_at).toLocaleString()}
                </div>
                ${order.notes ? `<div style="grid-column:1/-1;"><span class="label">Notes:</span> ${order.notes}</div>` : ''}
            </div>
            <div class="order-actions">
                <select id="status_${order.id}">
                    <option value="pending" ${order.payment_status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                    <option value="processing" ${order.order_status === 'processing' ? 'selected' : ''}>🔄 Processing</option>
                    <option value="completed" ${order.order_status === 'completed' ? 'selected' : ''}>✅ Completed</option>
                    <option value="cancelled" ${order.order_status === 'cancelled' ? 'selected' : ''}>❌ Cancelled</option>
                </select>
                <button class="btn-update" onclick="updateOrder('${order.id}')">Update</button>
                <button class="btn-delete" onclick="deleteOrder('${order.id}')">Delete</button>
            </div>
        </div>
    `).join('');
}

async function updateOrder(id) {
    const t = await getToken();
    if (!t) return;

    const statusSelect = document.getElementById(`status_${id}`);
    if (!statusSelect) {
        alert('Status selector not found');
        return;
    }
    
    const status = statusSelect.value;
    
    let payment_status = 'pending';
    if (status === 'completed' || status === 'processing') {
        payment_status = 'completed';
    } else if (status === 'cancelled') {
        payment_status = 'cancelled';
    }
    
    if (!confirm(`Update order status to "${status}" and notify customer?`)) {
        return;
    }
    
    try {
        const response = await fetch(`/api/admin/orders/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${t}`
            },
            body: JSON.stringify({ 
                payment_status: payment_status,
                order_status: status 
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || 'Could not update order');
        }

        alert('✅ Order updated successfully!\n📢 Notification sent to customer dashboard.');
        loadOrders();
    } catch (error) {
        console.error('Update error:', error);
        alert('❌ ' + error.message);
    }
}

async function deleteOrder(id) {
    if (!confirm('Delete this order? This action cannot be undone!')) return;
    
    const t = await getToken();
    if (!t) return;

    try {
        const response = await fetch(`/api/admin/orders/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${t}` }
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || 'Could not delete order');
        }

        alert('✅ Order deleted successfully!');
        loadOrders();
    } catch (error) {
        console.error('Delete error:', error);
        alert('❌ ' + error.message);
    }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/admin.html';
});

document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/admin-dashboard.html';
});

loadOrders();
</script>
</body>
</html>
