<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Projects | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #1f2937;
        }
        .navbar {
            height: 70px;
            background: #005f5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .navbar h1 { font-size: 21px; }
        .back-btn, .logout-btn {
            border: 1px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 8px;
        }
        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .header { margin-bottom: 25px; }
        .header h2 { font-size: 28px; margin-bottom: 7px; }
        .header p { color: #6b7280; }
        .form-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.04);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full { grid-column: 1 / -1; }
        label {
            font-weight: 600;
            margin-bottom: 7px;
        }
        input, textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-family: inherit;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .actions {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .save-btn {
            background: #005f5f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .save-btn:hover { opacity: 0.9; }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .edit-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 8px;
        }
        .message {
            display: none;
            padding: 11px 15px;
            border-radius: 7px;
            font-size: 14px;
        }
        .message.success {
            display: block;
            background: #e7f7ef;
            color: #147a43;
        }
        .message.error {
            display: block;
            background: #fdecec;
            color: #b42318;
        }
        .items-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            overflow: hidden;
        }
        .item-card .project-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #e5e7eb;
        }
        .item-card h3 { margin-bottom: 5px; }
        .item-card p { color: #6b7280; font-size: 14px; }
        .item-card .tech {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            background: #e6f7f4;
            color: #005f5f;
            font-size: 12px;
            margin: 5px 3px 0 0;
        }
        .item-card .links {
            margin: 10px 0;
        }
        .item-card .links a {
            color: #005f5f;
            text-decoration: none;
            margin-right: 10px;
            font-size: 14px;
        }
        .item-actions {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .loading { color: #6b7280; margin-bottom: 15px; }
        #imagePreview {
            margin-top: 10px;
        }
        #imagePreview img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            object-fit: cover;
        }
        #imagePreview button {
            display: block;
            margin-top: 5px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        #imagePreview button:hover { opacity: 0.9; }
        .file-upload-wrapper {
            position: relative;
            display: inline-block;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-upload-wrapper .upload-btn {
            background: #005f5f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .file-upload-wrapper .upload-btn:hover { opacity: 0.9; }
        #uploadStatus {
            margin-top: 8px;
            font-size: 14px;
            color: #6b7280;
        }
        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .navbar { padding: 0 15px; }
            .navbar h1 { font-size: 17px; }
            .items-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>My Resume Portfolio — Admin</h1>
    <div>
        <button id="backBtn" class="back-btn">Dashboard</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</nav>
<main class="container">
    <div class="header">
        <h2>Manage Projects</h2>
        <p>Add and manage your portfolio projects.</p>
    </div>
    <div id="loading" class="loading">Loading projects...</div>
    <div class="form-card">
        <h3 id="formTitle">Add New Project</h3>
        <form id="projectsForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label for="title">Title *</label>
                    <input id="title" type="text" placeholder="e.g., FoodHub Restaurant" required>
                </div>
                <div class="form-group full">
                    <label for="description">Description *</label>
                    <textarea id="description" placeholder="Describe your project..." required></textarea>
                </div>
                
                <!-- ✅ Cloudinary Image Upload Section -->
                <div class="form-group full">
                    <label>Project Image</label>
                    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                        <input id="image_url" type="url" placeholder="https://example.com/image.jpg" style="flex:1;min-width:200px;">
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span style="color:#6b7280;">OR</span>
                            <div class="file-upload-wrapper">
                                <input type="file" id="imageUpload" accept="image/*">
                                <button type="button" class="upload-btn">📤 Upload Image</button>
                            </div>
                        </div>
                    </div>
                    <div id="uploadStatus"></div>
                    <div id="imagePreview"></div>
                </div>

                <div class="form-group full">
                    <label for="technologies">Technologies (comma separated)</label>
                    <input id="technologies" type="text" placeholder="e.g., React, Node.js, PostgreSQL">
                </div>
                <div class="form-group">
                    <label for="live_url">Live URL</label>
                    <input id="live_url" type="url" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label for="github_url">GitHub URL</label>
                    <input id="github_url" type="url" placeholder="https://github.com/username/repo">
                </div>
                <div class="form-group">
                    <label for="sort_order">Sort Order</label>
                    <input id="sort_order" type="number" value="0">
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="save-btn">Save Project</button>
                <button type="button" id="cancelBtn" class="back-btn" style="color:#333;border-color:#d1d5db;">Cancel</button>
                <div id="message" class="message"></div>
            </div>
        </form>
    </div>
    <div id="projectsList" class="items-list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/admin-projects.js"></script>
</body>
</html>
