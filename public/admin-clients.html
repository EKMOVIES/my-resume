<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Clients | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #1f2937;
        }
        .navbar {
            height: 70px;
            background: #005f5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .navbar h1 { font-size: 21px; }
        .back-btn, .logout-btn {
            border: 1px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 8px;
        }
        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h2 { font-size: 28px; }
        .header p { color: #6b7280; }
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 6px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #005f5f;
            color: white;
            border-color: #005f5f;
        }
        .filter-btn:hover { opacity: 0.8; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stat-card .number {
            font-size: 24px;
            font-weight: bold;
            color: #005f5f;
        }
        .stat-card .label {
            font-size: 12px;
            color: #6b7280;
        }

        .form-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.04);
        }
        .form-card h3 { margin-bottom: 15px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full { grid-column: 1 / -1; }
        label {
            font-weight: 600;
            margin-bottom: 7px;
        }
        input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #005f5f;
        }
        .save-btn {
            background: #005f5f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .save-btn:hover { opacity: 0.9; }

        .items-list {
            display: grid;
            gap: 15px;
        }
        .item-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s;
        }
        .item-card.pending {
            border-left: 4px solid #f59e0b;
            background: #fffbeb;
        }
        .item-card.approved {
            border-left: 4px solid #10b981;
        }
        .item-card.rejected {
            border-left: 4px solid #ef4444;
            background: #fef2f2;
        }
        .item-content h3 { margin-bottom: 5px; }
        .item-content .meta {
            font-size: 13px;
            color: #6b7280;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.pending { background: #fef3c7; color: #92400e; }
        .badge.approved { background: #dcfce7; color: #166534; }
        .badge.rejected { background: #fee2e2; color: #991b1b; }

        .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .approve-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .reject-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .delete-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .project-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .loading { color: #6b7280; padding: 20px; text-align: center; }
        .empty { color: #6b7280; padding: 40px; text-align: center; }
        .projects-list {
            margin-top: 10px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
        }
        .projects-list .project-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .projects-list .project-item:last-child { border-bottom: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 14px;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            min-height: 100px;
            margin-bottom: 15px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-actions .confirm { background: #ef4444; color: white; }
        .modal-actions .cancel { background: #6b7280; color: white; }

        /* Project Modal */
        .project-modal-content {
            max-width: 600px;
        }
        .project-modal-content input,
        .project-modal-content textarea,
        .project-modal-content select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .project-modal-content textarea {
            min-height: 80px;
            resize: vertical;
        }
        .project-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .project-modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .project-modal-actions .save { background: #10b981; color: white; }
        .project-modal-actions .cancel { background: #6b7280; color: white; }

        @media (max-width: 700px) {
            .navbar { padding: 0 15px; }
            .navbar h1 { font-size: 17px; }
            .item-card { flex-direction: column; align-items: stretch; }
            .item-actions { justify-content: center; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>My Resume Portfolio — Admin</h1>
    <div>
        <button id="backBtn" class="back-btn">Dashboard</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</nav>
<main class="container">
    <div class="header">
        <div>
            <h2>👥 Client Management</h2>
            <p>Approve or reject client signup requests</p>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">⏳ Pending</button>
            <button class="filter-btn" data-filter="approved">✅ Approved</button>
            <button class="filter-btn" data-filter="rejected">❌ Rejected</button>
        </div>
    </div>

    <div class="stats" id="statsContainer">
        <div class="stat-card">
            <div class="number" id="totalCount">0</div>
            <div class="label">Total</div>
        </div>
        <div class="stat-card">
            <div class="number" id="pendingCount">0</div>
            <div class="label">⏳ Pending</div>
        </div>
        <div class="stat-card">
            <div class="number" id="approvedCount">0</div>
            <div class="label">✅ Approved</div>
        </div>
        <div class="stat-card">
            <div class="number" id="rejectedCount">0</div>
            <div class="label">❌ Rejected</div>
        </div>
    </div>

    <!-- Add Client Form -->
    <div class="form-card">
        <h3>➕ Add New Client</h3>
        <form id="clientForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input id="name" type="text" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input id="email" type="email" required placeholder="client@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input id="password" type="text" required placeholder="123456">
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input id="company" type="text" placeholder="ABC Company">
                </div>
                <div class="form-group full">
                    <label for="phone">Phone</label>
                    <input id="phone" type="text" placeholder="+880123456789">
                </div>
            </div>
            <button type="submit" class="save-btn">➕ Add Client</button>
            <div id="formMessage" style="margin-top:10px;display:none;padding:10px;border-radius:6px;"></div>
        </form>
    </div>

    <div id="loading" class="loading">Loading clients...</div>
    <div id="clientsList" class="items-list"></div>
</main>

<!-- Rejection Modal -->
<div class="modal" id="rejectModal">
    <div class="modal-content">
        <h3>❌ Reject Client</h3>
        <p style="color:#6b7280;margin-bottom:15px;">Please provide a reason for rejection:</p>
        <textarea id="rejectionReason" placeholder="Reason for rejection..."></textarea>
        <div class="modal-actions">
            <button class="confirm" onclick="confirmReject()">Reject</button>
            <button class="cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Project Modal -->
<div class="modal" id="projectModal">
    <div class="modal-content project-modal-content">
        <h3>📁 Add Project</h3>
        <p style="color:#6b7280;margin-bottom:15px;">Add a new project for this client:</p>
        <input type="hidden" id="projectClientId">
        <input type="text" id="projectName" placeholder="Project Name *" required>
        <input type="text" id="projectType" placeholder="Project Type (Website, App, Design, etc.)">
        <textarea id="projectDescription" placeholder="Project Description..."></textarea>
        <select id="projectStatus">
            <option value="active">🟢 Active</option>
            <option value="pending">🟡 Pending</option>
            <option value="completed">🔵 Completed</option>
            <option value="on-hold">🔴 On Hold</option>
        </select>
        <div class="project-modal-actions">
            <button class="save" onclick="confirmAddProject()">✅ Add Project</button>
            <button class="cancel" onclick="closeProjectModal()">Cancel</button>
        </div>
        <div id="projectMessage" style="margin-top:10px;display:none;padding:10px;border-radius:6px;"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://baepfcdvgruhvaccruum.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cDIynPGbHrsZjUK8gRhpDA_pu20FNiF';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentFilter = 'all';
let token = null;
let selectedClientId = null;
let allClients = [];

async function getToken() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        window.location.href = '/admin.html';
        return null;
    }
    token = session.access_token;
    return token;
}

// ============================================================
// LOAD CLIENTS
// ============================================================

async function loadClients(filter = 'all') {
    const t = await getToken();
    if (!t) return;

    try {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').textContent = 'Loading clients...';
        document.getElementById('clientsList').innerHTML = '';
        
        const url = filter === 'all' 
            ? '/api/admin/clients' 
            : `/api/admin/clients?status=${filter}`;
        
        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${t}` }
        });
        const result = await response.json();
        
        if (!response.ok) throw new Error(result.message);
        
        allClients = result.data || [];
        updateStats(allClients);
        renderList(allClients);
        document.getElementById('loading').style.display = 'none';
        
    } catch (error) {
        console.error(error);
        document.getElementById('loading').textContent = '❌ Error: ' + error.message;
        document.getElementById('loading').style.display = 'block';
    }
}

function updateStats(data) {
    const total = data.length;
    const pending = data.filter(c => c.status === 'pending').length;
    const approved = data.filter(c => c.status === 'approved').length;
    const rejected = data.filter(c => c.status === 'rejected').length;
    
    document.getElementById('totalCount').textContent = total;
    document.getElementById('pendingCount').textContent = pending;
    document.getElementById('approvedCount').textContent = approved;
    document.getElementById('rejectedCount').textContent = rejected;
}

function renderList(data) {
    const list = document.getElementById('clientsList');
    
    if (data.length === 0) {
        list.innerHTML = `<div class="empty">📭 No clients found</div>`;
        return;
    }
    
    list.innerHTML = data.map(c => `
        <div class="item-card ${c.status}">
            <div class="item-content">
                <h3>${c.name}</h3>
                <div class="meta">
                    📧 ${c.email}
                    ${c.company ? `| 🏢 ${c.company}` : ''}
                    ${c.phone ? `| 📱 ${c.phone}` : ''}
                </div>
                <div class="meta" style="margin-top:5px;">
                    <span class="badge ${c.status}">${c.status.toUpperCase()}</span>
                    ${c.created_at ? `| 📅 ${new Date(c.created_at).toLocaleDateString()}` : ''}
                    ${c.approved_at ? `| ✅ ${new Date(c.approved_at).toLocaleDateString()}` : ''}
                </div>
                ${c.rejection_reason ? `<div class="meta" style="color:#dc2626;margin-top:5px;">💬 ${c.rejection_reason}</div>` : ''}
                <div class="projects-list" id="projects-${c.id}">
                    <div style="color:#6b7280;font-style:italic;">Loading projects...</div>
                </div>
            </div>
            <div class="item-actions">
                ${c.status === 'pending' ? `
                    <button class="approve-btn" onclick="approveClient('${c.id}')">✅ Approve</button>
                    <button class="reject-btn" onclick="openRejectModal('${c.id}')">❌ Reject</button>
                ` : ''}
                <button class="project-btn" onclick="openProjectModal('${c.id}')">📁 Add Project</button>
                <button class="delete-btn" onclick="deleteClient('${c.id}')">🗑️ Delete</button>
            </div>
        </div>
    `).join('');
    
    // Load projects for each client
    data.forEach(c => {
        loadClientProjects(c.id);
    });
}

// ============================================================
// LOAD CLIENT PROJECTS
// ============================================================

async function loadClientProjects(clientId) {
    try {
        const response = await fetch(`/api/client/projects?clientId=${clientId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await response.json();
        
        const container = document.getElementById(`projects-${clientId}`);
        if (!container) return;
        
        const projects = result.data || [];
        
        if (projects.length === 0) {
            container.innerHTML = `<div style="color:#6b7280;font-style:italic;font-size:13px;">No projects yet</div>`;
            return;
        }
        
        container.innerHTML = projects.map(p => `
            <div class="project-item">
                <span>📁 ${p.project_name}</span>
                <span class="badge ${p.status || 'active'}">${p.status || 'active'}</span>
            </div>
        `).join('');
        
    } catch (error) {
        console.error('Error loading projects:', error);
    }
}

// ============================================================
// ADD CLIENT
// ============================================================

document.getElementById('clientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = await getToken();
    if (!t) return;
    
    const msg = document.getElementById('formMessage');
    msg.style.display = 'none';
    
    const data = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value.trim(),
        company: document.getElementById('company').value.trim(),
        phone: document.getElementById('phone').value.trim()
    };
    
    if (!data.name || !data.email || !data.password) {
        msg.textContent = '⚠️ Name, email and password are required';
        msg.style.display = 'block';
        msg.style.background = '#fdecec';
        msg.style.color = '#b42318';
        return;
    }
    
    try {
        const response = await fetch('/api/admin/clients', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${t}`
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (!response.ok) throw new Error(result.message);
        
        msg.textContent = '✅ Client added successfully!';
        msg.style.display = 'block';
        msg.style.background = '#e7f7ef';
        msg.style.color = '#147a43';
        
        document.getElementById('clientForm').reset();
        loadClients(currentFilter);
        
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
        
    } catch (error) {
        msg.textContent = '❌ ' + error.message;
        msg.style.display = 'block';
        msg.style.background = '#fdecec';
        msg.style.color = '#b42318';
    }
});

// ============================================================
// APPROVE / REJECT / DELETE
// ============================================================

async function approveClient(id) {
    if (!confirm('Approve this client?')) return;
    const t = await getToken();
    if (!t) return;
    
    try {
        const response = await fetch(`/api/admin/clients/${id}/approve`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${t}`
            },
            body: JSON.stringify({ adminNotes: 'Approved by admin' })
        });
        
        if (!response.ok) throw new Error('Could not approve');
        loadClients(currentFilter);
    } catch (error) {
        alert('Error: ' + error.message);
    }
}

function openRejectModal(id) {
    selectedClientId = id;
    document.getElementById('rejectModal').classList.add('active');
    document.getElementById('rejectionReason').value = '';
}

function closeModal() {
    document.getElementById('rejectModal').classList.remove('active');
    selectedClientId = null;
}

async function confirmReject() {
    const reason = document.getElementById('rejectionReason').value.trim() || 'No reason provided';
    const t = await getToken();
    if (!t || !selectedClientId) return;
    
    try {
        const response = await fetch(`/api/admin/clients/${selectedClientId}/reject`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${t}`
            },
            body: JSON.stringify({ rejectionReason: reason })
        });
        
        if (!response.ok) throw new Error('Could not reject');
        closeModal();
        loadClients(currentFilter);
    } catch (error) {
        alert('Error: ' + error.message);
    }
}

async function deleteClient(id) {
    if (!confirm('Delete this client? This action cannot be undone!')) return;
    const t = await getToken();
    if (!t) return;
    
    try {
        const response = await fetch(`/api/admin/clients/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${t}` }
        });
        if (!response.ok) throw new Error('Could not delete');
        loadClients(currentFilter);
    } catch (error) {
        alert('Error: ' + error.message);
    }
}

// ============================================================
// ADD PROJECT
// ============================================================

function openProjectModal(clientId) {
    selectedClientId = clientId;
    document.getElementById('projectClientId').value = clientId;
    document.getElementById('projectName').value = '';
    document.getElementById('projectType').value = '';
    document.getElementById('projectDescription').value = '';
    document.getElementById('projectStatus').value = 'active';
    document.getElementById('projectMessage').style.display = 'none';
    document.getElementById('projectModal').classList.add('active');
}

function closeProjectModal() {
    document.getElementById('projectModal').classList.remove('active');
    selectedClientId = null;
}

async function confirmAddProject() {
    const t = await getToken();
    if (!t) return;
    
    const msg = document.getElementById('projectMessage');
    msg.style.display = 'none';
    
    const data = {
        clientId: document.getElementById('projectClientId').value,
        projectName: document.getElementById('projectName').value.trim(),
        projectType: document.getElementById('projectType').value.trim() || 'Website',
        description: document.getElementById('projectDescription').value.trim(),
        status: document.getElementById('projectStatus').value
    };
    
    if (!data.projectName) {
        msg.textContent = '⚠️ Project name is required';
        msg.style.display = 'block';
        msg.style.background = '#fdecec';
        msg.style.color = '#b42318';
        return;
    }
    
    try {
        const response = await fetch('/api/admin/client-project', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${t}`
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (!response.ok) throw new Error(result.message);
        
        msg.textContent = '✅ Project added successfully!';
        msg.style.display = 'block';
        msg.style.background = '#e7f7ef';
        msg.style.color = '#147a43';
        
        setTimeout(() => {
            closeProjectModal();
            loadClients(currentFilter);
        }, 1500);
        
    } catch (error) {
        msg.textContent = '❌ ' + error.message;
        msg.style.display = 'block';
        msg.style.background = '#fdecec';
        msg.style.color = '#b42318';
    }
}

// ============================================================
// FILTER BUTTONS
// ============================================================

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        loadClients(currentFilter);
    });
});

// ============================================================
// LOGOUT & BACK
// ============================================================

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/admin.html';
});

document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/admin-dashboard.html';
});

// ============================================================
// INIT
// ============================================================

loadClients('all');
</script>
